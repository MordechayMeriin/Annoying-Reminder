# The backend: run its tests, and (on main) deploy it to AWS Lambda. Setup (once): backend/scripts/aws_lambda_setup.py,
# then the repository variables it prints (AWS_DEPLOY_ROLE_ARN, AWS_REGION). GitHub signs in to AWS with OIDC:
# no AWS keys are stored here, and the role may only update the one function's code.
name: Backend

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

env:
  FUNCTION: prominder-api

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r lambda/requirements.txt pytest "moto[dynamodb]"
      - run: python -m pytest -q

  deploy:
    name: Deploy to AWS Lambda
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # OIDC: GitHub proves to AWS that this is this repository's main branch
    env:
      HAS_ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' }}
    steps:
      # Checked out first, always: every step runs in backend/, which only exists after the checkout.
      - uses: actions/checkout@v4

      - name: Not set up yet
        if: env.HAS_ROLE != 'true'
        run: echo "::notice::AWS_DEPLOY_ROLE_ARN isn't set, so nothing was deployed. See docs/android-phase-c.md."

      - uses: actions/setup-python@v5
        if: env.HAS_ROLE == 'true'
        with:
          python-version: "3.12"
      - name: Check the variables
        if: env.HAS_ROLE == 'true'
        env:
          ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          REGION: ${{ vars.AWS_REGION }}
        run: |
          echo "AWS_DEPLOY_ROLE_ARN = '$ROLE'"
          echo "AWS_REGION          = '$REGION'"
          [[ "$ROLE" =~ ^arn:aws:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_-]+$ ]] || {
            echo "::error::AWS_DEPLOY_ROLE_ARN should be only the role's address, like arn:aws:iam::123456789012:role/prominder-github-deploy (no spaces, no name in front)"; exit 1; }
          [[ "$REGION" =~ ^[a-z]{2}(-[a-z]+)+-[0-9]$ ]] || {
            echo "::error::AWS_REGION should be a region code, like us-west-2"; exit 1; }

      - uses: aws-actions/configure-aws-credentials@v4
        if: env.HAS_ROLE == 'true'
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # When AWS refuses, show what GitHub told it (who is asking, for which branch), so the role's rule can be
      # compared with it. These are the token's claims only, never the token.
      - name: What GitHub sent AWS
        if: failure() && env.HAS_ROLE == 'true'
        run: |
          python3 - <<'EOF'
          import base64, json, os, urllib.request
          req = urllib.request.Request(os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=sts.amazonaws.com",
                                       headers={"Authorization": "bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})
          token = json.load(urllib.request.urlopen(req))["value"]
          payload = token.split(".")[1]
          claims = json.loads(base64.urlsafe_b64decode(payload + "=" * (-len(payload) % 4)))
          for key in ("sub", "aud", "repository", "ref", "event_name"):
              print(f"{key}: {claims.get(key)}")
          print("The role prominder-github-deploy must allow exactly this 'sub' (IAM → Roles → it → Trust relationships).")
          EOF

      - name: Package (dependencies built for Lambda's Linux and Python 3.12)
        if: env.HAS_ROLE == 'true'
        run: |
          pip install --quiet --target build --platform manylinux2014_x86_64 --implementation cp \
            --python-version 3.12 --only-binary=:all: -r lambda/requirements.txt
          cp -r app build/
          find build -name "__pycache__" -prune -exec rm -rf {} +
          (cd build && zip -qr ../lambda.zip .)
          ls -lh lambda.zip

      - name: Deploy
        if: env.HAS_ROLE == 'true'
        run: |
          aws lambda update-function-code --function-name "$FUNCTION" --zip-file fileb://lambda.zip --query LastModified
          aws lambda wait function-updated-v2 --function-name "$FUNCTION"

      - name: Check it answers
        if: env.HAS_ROLE == 'true'
        run: |
          url=$(aws lambda get-function-url-config --function-name "$FUNCTION" --query FunctionUrl --output text)
          for i in 1 2 3 4 5; do
            if curl -fsS "${url%/}/health"; then echo; echo "Live at ${url%/}"; exit 0; fi
            sleep 5
          done
          echo "::error::${url%/}/health didn't answer"; exit 1
