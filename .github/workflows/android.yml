# The Android app: build, test, render screenshots, and (on main) upload to Google Play's internal testing.
# Setup (secrets, variables, the first manual upload): android/README.md.
name: Android

on:
  push:
    branches: [main, "android-*"]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload this build to Google Play (internal testing)"
        type: boolean
        default: false

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: android

env:
  # Public values (the web app ships them to every browser), kept as repository *variables*.
  SUPABASE_URL: ${{ vars.SUPABASE_URL }}
  SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
  # Every Play upload needs a higher versionCode: the run number followed by the attempt (run 12 → 121,
  # its re-run → 122, run 13 → 131), so it always goes up.
  VERSION_CODE: ${{ github.run_number }}${{ github.run_attempt }}
  VERSION_NAME: 0.1.${{ github.run_number }}

jobs:
  build:
    name: Build, test, screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (logic, login, alarms on a simulated Android 10 and 14)
        run: ./gradlew --stacktrace :app:testDebugUnitTest

      - name: Lint
        run: ./gradlew :app:lintDebug

      - name: Screenshots
        run: ./gradlew :app:recordRoborazziDebug

      - name: Debug app
        run: ./gradlew :app:assembleDebug

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: android/app/screenshots/
          if-no-files-found: ignore

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  release:
    name: Upload to Google Play (internal testing)
    needs: build
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.upload)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: play
    env:
      HAS_KEY: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 != '' }}
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Check the signing secrets
        if: env.HAS_KEY != 'true'
        run: |
          echo "::error::ANDROID_UPLOAD_KEYSTORE_BASE64 isn't set. See android/README.md, 'Upload key'."
          exit 1

      - name: Write the upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"

      - name: Signed app bundle
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease

      - name: Keep the bundle (for the first, manual upload)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/mapping/release/mapping.txt
          retention-days: 30

      - name: Upload to internal testing
        if: env.HAS_PLAY == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.annoyingreminder.app
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          mappingFile: android/app/build/outputs/mapping/release/mapping.txt
          track: internal
          # "draft" until the app's first release has been rolled out by hand in the Play Console.
          status: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}

      - name: No Play credentials yet
        if: env.HAS_PLAY != 'true'
        run: echo "::notice::PLAY_SERVICE_ACCOUNT_JSON isn't set, so the bundle was built but not uploaded. Download it from this run's artifacts."
