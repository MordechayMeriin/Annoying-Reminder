# Render Blueprint: New → Blueprint → pick this repo. Creates both services on the free plan.
# Values marked sync: false are asked for during setup (paste them from the checklist in README.md).
services:
  - type: web
    name: annoying-reminder-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      # Google sign-in (the Android app): see android/README.md, "Google sign-in"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: OWNER_GOOGLE_EMAIL
        sync: false
      # AWS: the values scripts/aws_setup.py prints. The three Cognito ones are optional (the web app's login).
      - key: AWS_REGION
        sync: false
      - key: DYNAMODB_TABLE
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: COGNITO_USER_POOL_ID
        sync: false
      - key: COGNITO_CLIENT_ID
        sync: false
      - key: OWNER_USER_ID
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODELS
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: ACTION_SECRET
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: API_URL
        sync: false
      - key: PUSHOVER_TOKEN
        sync: false
      - key: PUSHOVER_USER
        sync: false
      # Timeouts in seconds, edited in the Render dashboard (the code falls back to 25 / 60 if unset).
      - key: LLM_TIMEOUT_S         # one LLM call
        sync: false
      - key: CHAT_TURN_TIMEOUT_S   # a whole chat turn, all its LLM calls and tools
        sync: false

  - type: web
    name: annoying-reminder-web
    runtime: static
    rootDir: web
    buildCommand: sh build-config.sh
    staticPublishPath: .
    envVars:
      - key: COGNITO_REGION
        sync: false
      - key: COGNITO_CLIENT_ID
        sync: false
      - key: API_URL
        sync: false
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /config.js
        name: Cache-Control
        value: no-cache
