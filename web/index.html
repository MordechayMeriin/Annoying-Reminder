<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#111827">
  <title>Annoying Reminder</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script src="/config.js"></script>
  <script type="module" src="/app.js"></script>
</head>
<body>
  <!-- Shown until app.js has loaded and checked the login -->
  <section id="loading" class="screen loading" aria-live="polite">
    <div class="loading-icon" aria-hidden="true">🔔</div>
    <p id="loading-msg" class="muted">Loading…</p>
    <button id="loading-retry" class="small" hidden>Retry</button>
  </section>
  <script>
    // If app.js (or the login library it imports) can't load, say so instead of a blank screen.
    setTimeout(function () {
      if (window.__appLoaded) return;
      document.getElementById("loading-msg").textContent = "Couldn't load the app. Check your connection.";
      var retry = document.getElementById("loading-retry");
      retry.hidden = false;
      retry.onclick = function () { location.reload(); };
    }, 10000);
  </script>
  <!-- Login -->
  <section id="login" class="screen" hidden>
    <div class="card login-card">
      <h1>🔔 Annoying Reminder</h1>
      <form id="email-form">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" required>
        <button type="submit">Send login code</button>
      </form>
      <form id="code-form" hidden>
        <label for="code">Code from the email</label>
        <input id="code" inputmode="numeric" autocomplete="one-time-code" required>
        <button type="submit">Log in</button>
      </form>
      <p id="login-msg" class="muted"></p>
    </div>
  </section>

  <!-- Main: the chat -->
  <section id="main" class="screen" hidden>
    <header>
      <h1>🔔 Reminder</h1>
      <div class="header-actions">
        <button id="enable-push" class="small" hidden>Enable notifications</button>
        <button id="open-tasks" class="small ghost" title="Tasks">☑ Tasks <span id="task-count" class="badge" hidden></span></button>
        <button id="refresh" class="small ghost" title="Refresh">↻</button>
        <button id="open-settings" class="small ghost" title="Settings" aria-label="Settings">⚙</button>
        <button id="logout" class="small ghost" title="Log out">⎋</button>
      </div>
      <!-- A focus session is running and its screen is closed: tap to open the timer again -->
      <button id="session-bar" type="button" class="session-bar" hidden></button>
    </header>

    <!-- Today's 3: display only, nothing to configure. Set every morning; silence accepts it. -->
    <section id="focus" class="focus" hidden aria-label="Today's 3">
      <div class="focus-head">
        <span class="focus-title">🎯 Today's 3</span>
        <span id="focus-done" class="focus-done"></span>
        <button id="focus-what-now" type="button" class="small ghost">What now?</button>
      </div>
      <ol id="focus-list" class="focus-list"></ol>
    </section>

    <main id="chat" class="chat">
      <button id="load-earlier" class="small ghost load-earlier" hidden>Load earlier messages</button>
      <div id="messages" class="messages"></div>
      <div id="chat-status" class="chat-status" aria-live="polite" hidden></div>
      <!-- After a stopped or unanswered session: optional, never blocking. Ignoring it changes nothing. -->
      <form id="breadcrumb" class="breadcrumb" hidden>
        <label for="breadcrumb-input" id="breadcrumb-label">Where did you stop? (optional)</label>
        <div class="breadcrumb-row">
          <input id="breadcrumb-input" dir="auto" maxlength="300" autocomplete="off" enterkeyhint="done">
          <button type="button" id="breadcrumb-mic" class="mic small ghost" aria-label="Dictate" hidden>🎤</button>
          <button type="submit" class="small">Save</button>
          <button type="button" id="breadcrumb-skip" class="small ghost" aria-label="Skip">✕</button>
        </div>
      </form>
    </main>

    <form id="chat-form" class="chat-form">
      <textarea id="chat-input" dir="auto" rows="1" autocomplete="off"
                placeholder="Reply or add a task…"></textarea>
      <button type="button" id="chat-mic" class="mic" aria-label="Dictate" hidden>🎤</button>
      <button type="submit" id="chat-send" aria-label="Send">➤</button>
    </form>
  </section>

  <!-- Focus session: the timer. Display only (nothing to fill in); ✕ hides it, the timer keeps running. -->
  <section id="session" class="session-screen" hidden aria-label="Focus session">
    <div class="session-top">
      <span id="session-title" class="session-title" dir="auto"></span>
      <button id="session-close" type="button" class="small ghost" aria-label="Hide the timer">✕</button>
    </div>
    <div class="session-ring-wrap">
      <svg class="session-ring" viewBox="0 0 120 120" aria-hidden="true">
        <circle class="ring-bg" cx="60" cy="60" r="52"></circle>
        <circle id="ring-fg" class="ring-fg" cx="60" cy="60" r="52"></circle>
      </svg>
      <div id="session-time" class="session-time" role="timer" aria-live="off">25:00</div>
    </div>
    <div id="session-step" class="session-step" dir="auto"></div>
    <div id="session-note" class="session-note" dir="auto" hidden></div>
    <div id="session-lengths" class="session-lengths" role="group" aria-label="Session length"></div>
    <div id="session-run" class="session-actions">
      <button id="session-done" type="button" class="done">✓ Done</button>
      <button id="session-plus" type="button" class="ghost">+5</button>
      <button id="session-stop" type="button" class="ghost">Stop</button>
    </div>
    <div id="session-over" class="session-actions" hidden>
      <button id="session-over-done" type="button" class="done">✓ Done</button>
      <button id="session-another" type="button">▶ Another round</button>
      <button id="session-over-stop" type="button" class="ghost">Stop</button>
    </div>
  </section>

  <!-- Tasks drawer -->
  <div id="drawer-backdrop" class="backdrop" hidden></div>
  <aside id="drawer" class="drawer" hidden aria-label="Tasks">
    <div class="drawer-head">
      <button id="drawer-back" class="small ghost" hidden>‹ Back</button>
      <h2 id="drawer-title" class="drawer-title" hidden>⚙ Settings</h2>
      <nav class="tabs" id="drawer-tabs">
        <button data-tab="today" class="active">Today</button>
        <button data-tab="all">All open</button>
      </nav>
      <button id="drawer-close" class="small ghost" aria-label="Close">✕</button>
    </div>

    <div id="tab-today" class="drawer-body">
      <h2>Overdue &amp; today</h2>
      <ul id="today-list" class="tasks"></ul>
      <h2>Coming up</h2>
      <ul id="upcoming-list" class="tasks"></ul>
    </div>
    <div id="tab-all" class="drawer-body" hidden>
      <ul id="all-list" class="tasks"></ul>
    </div>

    <div id="task-detail" class="drawer-body detail" hidden>
      <h3 id="detail-title" dir="auto"></h3>
      <div id="detail-meta" class="muted"></div>
      <div id="detail-step" class="detail-step" dir="auto" hidden></div>
      <div id="detail-blocked" class="blocked" dir="auto" hidden></div>
      <label for="detail-desc" class="field-label">Description <span class="muted">— what the assistant knows about this task</span></label>
      <textarea id="detail-desc" dir="auto" rows="5" maxlength="800"></textarea>
      <div class="detail-actions">
        <button id="detail-save" class="small" disabled>Save</button>
        <span class="spacer"></span>
        <button id="detail-snooze" class="small ghost">⏰ 1h</button>
        <button id="detail-done" class="small done">✓ Done</button>
        <button id="detail-cancel" class="small ghost">Cancel task</button>
      </div>
      <h2>Steps</h2>
      <ul id="detail-subtasks" class="tasks"></ul>
      <h2>History</h2>
      <ul id="detail-events" class="events"></ul>
    </div>
    <div id="settings-panel" class="drawer-body settings" hidden>
      <p class="muted settings-intro">Times, delays and limits. You can also just say it in the chat ("no messages after 22:00"). Secrets stay on the server.</p>
      <section id="preferences" class="settings-group preferences" hidden aria-label="What you asked for"></section>
      <form id="settings-form" novalidate></form>
      <div class="settings-actions">
        <button id="settings-discard" type="button" class="small ghost" disabled>Discard</button>
        <button id="settings-save" type="button" class="small" disabled>Save</button>
      </div>
    </div>
  </aside>

  <div id="toast" class="toast" hidden></div>
</body>
</html>
